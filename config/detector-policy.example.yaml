#     / sum(container_spec_cpu_quota{pod=~"checkout-api.*"}
#     / container_spec_cpu_period{pod=~"checkout-api.*"}) * 100
#   
#   # Memory usage (percentage)
#   memory_usage: >
#     sum(container_memory_usage_bytes{pod=~"checkout-api.*"})
#     / sum(container_spec_memory_limit_bytes{pod=~"checkout-api.*"}) * 100
#   
#   # Retry rate
