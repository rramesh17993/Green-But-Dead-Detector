#   
#   # Queue depth
#   queue_depth: >
#     sum(queue_depth{job="checkout-api"})
#   
#   # Connection pool usage (percentage)
#   connection_pool_usage: >
#     sum(connection_pool_active{job="checkout-api"})
#     / sum(connection_pool_max{job="checkout-api"}) * 100

# ==========================================
# TIME WINDOWS
# ==========================================
# How far back to look for current data
lookback_window: 15m
# How far back to look for baseline calculation
baseline_window: 1h

# ==========================================
# NOTES
# ==========================================
# This configuration is intentionally explicit and commented.
# Tune these values based on your service's behavior:
#
# - Start with conservative thresholds (higher percentages)
# - Observe false positive rate
# - Gradually tighten thresholds
# - Different services may need different configs
#
# The goal is NOT perfect accuracy.
# The goal is catching the contradiction when everything looks green.
